      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(

        #004562 100%
      );
      transition: opacity 0.36s ease-out, visibility 0.36s ease-out;
    }

    #meloop-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .meloop-splash-svg {
      width: min(380px, 74vw);
      height: auto;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 12px 28px rgba(0, 22, 34, 0.34));
    }

    /* Oscilación suave de izquierda a derecha sobre el eje central del vinilo */
    .meloop-vinyl-disc {
      transform-box: view-box;
      transform-origin: 382.585px 76.661px;
      animation: vinyl-rock 1.8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes vinyl-rock {
      0%, 100% {
        transform: rotate(-14deg);
      }
      50% {
        transform: rotate(14deg);
      }
    }

  <script>
    window.dismissMeloopSplash = function () {
      var splash = document.getElementById('meloop-splash');
      if (!splash || splash.classList.contains('hidden')) return;
      splash.classList.add('hidden');
      window.setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 420);
    };

    // Fallback de seguridad en caso de que la app tarde demasiado o no notifique.
    window.addEventListener('flutter-first-frame', function () {
      window.setTimeout(function () {
        if (typeof window.dismissMeloopSplash === 'function') {
          window.dismissMeloopSplash();
        }
      }, 15000);
    });
  </script>
