services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meloop_social_loadtest
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - loadtest-postgres-data:/var/lib/postgresql/data
      - ../../../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meloop_social_loadtest"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      loadtest:
        aliases:
          - postgres

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      loadtest:
        aliases:
          - redis

  auth-service:
    build:
      context: ../../..
      dockerfile: services/auth-service/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres@postgres:5432/meloop_social_loadtest?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SESSION_TTL_HOURS: "24"
    ports:
      - "127.0.0.1:18083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      loadtest:
        aliases:
          - auth-service

  social-service:
    build:
      context: ../../..
      dockerfile: services/social-service/Dockerfile
    environment:
      GIN_MODE: release
      SOCIAL_SERVICE_PORT: 8086
      DATABASE_URL: postgres://postgres@postgres:5432/meloop_social_loadtest?sslmode=disable
      AUTH_SERVICE_URL: http://auth-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      loadtest:
        aliases:
          - social-service

  api-gateway:
    build:
      context: ../../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      GIN_MODE: release
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8083
      SOCIAL_SERVICE_URL: http://social-service:8086
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      auth-service:
        condition: service_started
      social-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      loadtest:
        aliases:
          - api-gateway

networks:
  loadtest:
    driver: bridge

volumes:
  loadtest-postgres-data:
