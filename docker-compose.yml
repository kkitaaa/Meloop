services:
  ml-service:
    build:
      context: ./ml-service
    container_name: meloop-ml-service
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - meloop-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: meloop-api-gateway
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: debug
      PORT: 8080
      TEST_SERVICE_URL: http://test-service:8081
      USER_SERVICE_URL: http://user-service:8082
      AUTH_SERVICE_URL: http://auth-service:8083
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    depends_on:
      - test-service
      - user-service
      - auth-service
      - media-service
      - redis
      - rabbitmq
      - minio
    networks:
      - meloop-network

  test-service:
    build:
      context: .
      dockerfile: services/test-service/Dockerfile
    container_name: meloop-test-service
    ports:
      - "8081:8081"
    networks:
      - meloop-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: meloop-user-service
    ports:
      - "8082:8082"
    environment:
      MEDIA_SERVICE_URL: http://media-service:8085
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/postgres?sslmode=disable}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - meloop-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: meloop-auth-service
    ports:
      - "8083:8083"
    networks:
      - meloop-network

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    container_name: meloop-media-service
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_MEDIA_USER: ${MINIO_MEDIA_USER}
      MINIO_MEDIA_PASSWORD: ${MINIO_MEDIA_PASSWORD}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-meloop-media}
    depends_on:
      - minio
    networks:
      - meloop-network

  redis:
    image: redis:7.2
    container_name: redis_server
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - meloop-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: meloop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - meloop-network

  minio:
    image: minio/minio:latest
    container_name: meloop-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - meloop-network

  minio-init:
    image: minio/mc:latest
    container_name: meloop-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/infrastructure/minio/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_MEDIA_USER: ${MINIO_MEDIA_USER}
      MINIO_MEDIA_PASSWORD: ${MINIO_MEDIA_PASSWORD}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-meloop-media}
    volumes:
      - ./infrastructure/minio:/infrastructure/minio:ro
    networks:
      - meloop-network

networks:
  meloop-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  minio_data: