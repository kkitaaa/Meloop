  /users/{id}/profile:
    get:
      tags: [Usuarios]
      operationId: getUserProfile
      summary: Consultar el perfil de un usuario
      security:
        - bearerAuth: []
      x-required-roles: user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Perfil consultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
