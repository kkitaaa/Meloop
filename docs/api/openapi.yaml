openapi: 3.0.3
info:
  title: Meloop Gateway API
  version: 1.0.0
  description: |
    Contrato REST versionado de Meloop. Se documentan las operaciones que hoy
    existen detrás de las rutas del Gateway; los dominios sin rutas desplegadas
    se indican en sus tags como pendientes y no se simulan.

    Las rutas protegidas aceptan el session_token opaco de Auth en el esquema
    HTTP Bearer. El Gateway valida cada token contra Auth, elimina las cabeceras
    de identidad aportadas por el cliente e inyecta la identidad y el rol
    verificados. Los IDs de usuario e interacción son UUID.
servers:
  - url: http://localhost:8080
    description: API Gateway local
tags:
  - name: Auth
    description: Registro, inicio de sesión y cuenta.
  - name: Usuarios
    description: Cuenta, perfil, privacidad, notificaciones e inventario.
  - name: Social
    description: Amistades, solicitudes, bloqueos y sugerencias.
  - name: Publicaciones
    description: "Pendiente: el Gateway aún no enruta publicaciones, comentarios ni likes."
  - name: Música
    description: "Pendiente: no hay rutas de catálogo o reproducción musical en el Gateway."
  - name: Chat
    description: "Pendiente: no hay rutas REST de chat en el Gateway; el WebSocket se documentará aparte."
  - name: Notificaciones
    description: Solo están disponibles las preferencias de notificación del usuario.
  - name: Gamificación
    description: "Pendiente: el Gateway aún no enruta gamification-service."
  - name: Moderación
    description: Solo está disponible la administración de usuarios del user-service.
  - name: Administración
    description: Operaciones administrativas y diagnósticos de desarrollo.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Administración]
      security: []
      operationId: gatewayHealth
      summary: Comprobar el estado del Gateway
      responses:
        '200':
          description: Gateway disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: register
      summary: Registrar una cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: ana
              email: ana@example.com
              password: password-segura
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana@example.com
              password: password-segura
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-recovery:
    post:
      tags: [Auth]
      security: []
      operationId: requestPasswordRecovery
      summary: Solicitar recuperación de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
            example:
              email: ana@example.com
      responses:
        '200':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password-recovery/reset:
    post:
      tags: [Auth]
      security: []
      operationId: resetPassword
      summary: Restablecer contraseña con el token de recuperación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar la sesión activa
      security:
        - bearerAuth: []
      x-required-roles: user
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/validate:
    get:
      tags: [Auth]
      operationId: validateSession
      summary: Validar la sesión activa
      security:
        - bearerAuth: []
      x-required-roles: user
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/change-password:
    post:
