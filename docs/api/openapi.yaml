          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/password:
    patch:
      tags: [Auth]
      operationId: changePasswordPatch
      summary: Cambiar la contraseña (alias PATCH)
      security:
        - bearerAuth: []
      x-required-roles: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Usuarios]
      operationId: listUsersPublic
      summary: Listar usuarios (endpoint heredado)
      description: Respuesta heredada de prueba; los IDs de ejemplo todavía son enteros y no UUID.
      security:
        - bearerAuth: []
      x-required-roles: user
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, username, email]
                      properties:
                        id:
                          type: integer
                          description: ID entero heredado de esta ruta de demostración.
                        username:
                          type: string
                        email:
                          type: string
                          format: email
                  error:
                    type: object
                    nullable: true
              example:
                success: true
                data:
                  - id: 1
                    username: alanp
                    email: alanp@example.com
                  - id: 2
                    username: antigravity
                    email: antigravity@example.com
                error: null
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Usuarios]
      operationId: createUserLegacy
      summary: Crear usuario (endpoint heredado)
      security:
        - bearerAuth: []
      x-required-roles: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: ana
              email: ana@example.com
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 3
                  username: ana
                  email: ana@example.com
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [Usuarios]
      operationId: getMyAccount
      summary: Consultar los datos básicos de la cuenta
      security:
