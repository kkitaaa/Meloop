components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session_token
      description: Copia el campo data.session_token de la respuesta de login.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FriendshipId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InventoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              enum: [false]
            data:
              type: object
              nullable: true
    SuccessResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          enum: [true]
        data: {}
        error:
          type: object
          nullable: true
    LoginResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [session_token, expires_in, user]
          properties:
            session_token:
              type: string
            expires_in:
              type: integer
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
        error:
          type: object
          nullable: true
    ValidateSessionResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        error:
          type: object
          nullable: true
    AuthenticatedUser:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, moderator, admin]
    Pagination:
      type: object
      required: [limit, cursor, next_cursor]
      properties:
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
          nullable: true
        next_cursor:
          type: string
          nullable: true
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        id_usuario:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
    Post:
      type: object
      description: Esquema reservado; no hay todavía rutas de publicaciones en el Gateway.
      properties:
        id:
          type: string
          format: uuid
    Comment:
      type: object
      description: Esquema reservado; no hay todavía rutas de comentarios en el Gateway.
      properties:
        id:
          type: string
          format: uuid
    RecommendationResponse:
      type: object
      required: [user_id, recommendations, model, model_version, interaction_count, from_backup]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID del usuario propietario de las recomendaciones.
        recommendations:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: string
                description: UUID del usuario o identificador string del elemento de catálogo.
              item_key:
                type: string
              type:
                type: string
              name:
                type: string
              score:
                type: number
                format: double
              reason:
                type: string
        model:
          type: string
        model_version:
          type: string
        interaction_count:
          type: integer
        calculated_at:
          type: string
          format: date-time
        from_backup:
          type: boolean
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        fecha_nacimiento:
          type: string
          format: date
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    CreateUserRequest:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
    UpdateProfileRequest:
      type: object
      properties:
        biografia:
          type: string
        bio:
          type: string
        foto_perfil:
          type: string
        avatar:
          type: string
        avatar_url:
          type: string
        banner:
          type: string
        banner_url:
          type: string
        tema:
          type: string
        theme:
          type: string
        colores:
          type: object
          additionalProperties: true
        colors:
          type: object
          additionalProperties: true
        informacion_musical:
          type: object
          properties:
            generos:
              type: array
              items:
                type: string
            artistas:
              type: array
              items:
                type: string
            canciones:
              type: array
              items:
                type: string
        preferencias_musicales:
          type: object
          additionalProperties: true
    UpdateNotificationsRequest:
      type: object
      properties:
        configuraciones:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSetting'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSetting'
    NotificationSetting:
      type: object
      required: [tipo_notificacion, habilitada]
      properties:
        tipo_notificacion:
          type: string
          enum: [SOLICITUD_AMISTAD, SOLICITUD_AMISTAD_ACEPTADA, LIKE, COMENTARIO, RESPUESTA, MENSAJE, SUBIDA_NIVEL, RECOMPENSA_DESBLOQUEADA, ACCION_MODERACION]
        habilitada:
          type: boolean
    UserModerationRequest:
      type: object
      properties:
        reason:
          type: string
    ExcludeBlockedRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        id_usuario:
          type: string
          format: uuid
        candidate_ids:
          type: array
          items:
            type: string
            format: uuid
        candidatos:
          type: array
          items:
            type: string
            format: uuid
    PresignedUploadRequest:
      type: object
      properties:
        resource_type:
          type: string
          enum: [profile_photo, banner]
        tipo_recurso:
          type: string
        content_type:
          type: string
          example: image/jpeg
        tipo_mime:
          type: string
        mime:
          type: string
        file_name:
          type: string
        nombre:
          type: string
        file_size:
          type: integer
          format: int64
          maximum: 5242880
        tamano_bytes:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_ERROR
              message: El campo 'email' es obligatorio y debe ser un correo válido
              details:
                field: email
                issue: invalid_format
    Unauthorized:
      description: Autenticación requerida o no válida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: UNAUTHORIZED
              message: Token de autenticación vencido o inválido
    Forbidden:
      description: Permisos insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: FORBIDDEN
              message: No tienes permisos para acceder a este recurso
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: El usuario con ID 123 no existe
    Conflict:
      description: Conflicto con el estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: CONFLICT
              message: El correo electrónico ya está registrado
    UnprocessableEntity:
      description: Entidad no procesable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Límite de solicitudes excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: TOO_MANY_REQUESTS
              message: Demasiados intentos fallidos de inicio de sesión. Cuenta bloqueada temporalmente.
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: INTERNAL_ERROR
              message: Ha ocurrido un error interno
    BadGateway:
