        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/notificaciones:
    get:
      tags: [Notificaciones]
      operationId: getNotificationSettingsSpanishAlias
      summary: Consultar preferencias de notificación (alias español)
      security:
        - bearerAuth: []
      x-required-roles: user
      responses:
        '200':
          description: Preferencias consultadas
          content:
            application/json:
