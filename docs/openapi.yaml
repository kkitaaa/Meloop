openapi: 3.0.3
info:
  title: Meloop API Common Response & Error System
  version: 1.0.0
  description: |
    Documentación del sistema unificado de respuestas y manejo de errores
    para los microservicios de Meloop y su integración con Flutter.
paths:
  /health:
    get:
      summary: Health check de API Gateway
      responses:
        '200':
          description: Éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  status: ok
                error: null
  /v1/music/search:
    get:
      summary: Buscar canciones, artistas, álbumes o géneros
      description: |
        El catálogo usa Spotify Client Credentials en el music-service. El tipo
        genre consulta el catálogo curado de Meloop y no se envía a Spotify.
        El límite es 20; para Spotify se combinan páginas de hasta 10 resultados.
        Para canciones, artistas y álbumes, offset + limit no puede superar 1010.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: type
          in: query
          schema:
            type: string
            enum: [track, artist, album, genre]
            default: track
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Resultados normalizados y paginación en data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  results:
                    - type: track
                      spotify_id: 4iV5W9uYEdYUVa79Axb7Rh
                      name: Ejemplo
                      artists: [Artista]
                      album: Álbum
                      image_url: ""
                      external_url: ""
                  offset: 0
                  limit: 10
                  total: 1
                error: null
        '400':
          description: Parámetros inválidos (INVALID_PARAMETER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Spotify limitó temporalmente las consultas (MUSIC_RATE_LIMITED)
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Spotify no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/music/{type}/{id}:
    get:
      summary: Consultar detalle de una canción, artista o álbum
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [tracks, artists, albums]
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{22}$'
      responses:
        '200':
          description: Objeto de catálogo musical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: ID de Spotify inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El elemento no existe en el catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Spotify no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/music/preferences:
    get:
      summary: Obtener preferencias musicales del usuario autenticado
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Token de sesión en formato Bearer
      responses:
        '200':
          description: Preferencias musicales y límites por categoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Token de sesión inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: auth-service no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Guardar una preferencia musical del usuario autenticado
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Token de sesión en formato Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, item_id, name]
              properties:
                type:
                  type: string
                  enum: [track, artist, genre]
                item_id:
                  type: string
                  maxLength: 50
                name:
                  type: string
                  maxLength: 200
                artwork_url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '200':
          description: Preferencia guardada y lista actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Preferencia inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token de sesión inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Preferencia duplicada o límite de categoría alcanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: auth-service no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/music/preferences/{type}/{item_id}:
    delete:
      summary: Eliminar una preferencia musical del usuario autenticado
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Token de sesión en formato Bearer
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [track, artist, genre]
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Preferencia eliminada y lista actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Tipo o ID de preferencia inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token de sesión inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: auth-service no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /test/health:
    get:
      summary: Health check de Test Service (Enrutado a través del Gateway con prefijo recortado)
      responses:
        '200':
          description: Éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  service: test-service
                  status: ok
                error: null
  /users:
    get:
      summary: Listado de usuarios (User Service)
      responses:
        '200':
          description: Éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  - id: 1
                    username: alanp
                    email: alanp@example.com
                  - id: 2
                    username: antigravity
                    email: antigravity@example.com
                error: null
    post:
      summary: Crear nuevo usuario (User Service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
              properties:
                username:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: Creado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  id: 3
                  username: nuevo_usuario
                  email: nuevo@meloop.com
                error: null
        '400':
          description: Error de validación (e.g. campo obligatorio faltante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: "El campo 'username' es obligatorio"
                  details:
                    field: username
                    issue: required

  /auth/login:
    post:
      summary: Iniciar sesión (Auth Service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Autenticado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  token: "ejemplo-token-jwt-seguro"
                  expires_in: 3600
                error: null
        '400':
          description: Error de validación de credenciales vacías
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: "El correo electrónico es obligatorio"
                  details:
                    field: email
                    issue: required
        '401':
          description: Autenticación fallida (contraseña incorrecta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: UNAUTHORIZED
                  message: "Credenciales incorrectas"

  /test/panic:
    get:
      summary: Ejemplo de pánico del sistema recuperado por el Middleware
      responses:
        '500':
          description: Error interno del servidor (pánico recuperado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: INTERNAL_ERROR
                  message: "Ha ocurrido un error interno"

components:
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Datos devueltos por la API (el formato varía según el endpoint)
        error:
          type: object
          nullable: true
          example: null
    ErrorResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Código estandarizado de error (e.g. VALIDATION_ERROR, UNAUTHORIZED, BAD_GATEWAY)
        message:
          type: string
          description: Mensaje legible por humanos explicando el error
        details:
          type: object
          description: Detalles opcionales del error (e.g. lista de campos de validación o detalles técnicos)
