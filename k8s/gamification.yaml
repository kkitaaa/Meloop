apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-service
  namespace: meloop
  labels:
    app.kubernetes.io/name: gamification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gamification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamification-service
    spec:
      containers:
        - name: gamification-service
          image: ghcr.io/kkitaaa/meloop/gamification-service:0ffc4c5-authz
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
          env:
            - name: GAMIFICATION_SERVICE_PORT
              value: "8089"
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8083
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gamification-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: gamification-secrets
                  key: RABBITMQ_URL
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: gamification-service
  namespace: meloop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gamification-service
  ports:
    - name: http
      port: 8089
      targetPort: http
      protocol: TCP