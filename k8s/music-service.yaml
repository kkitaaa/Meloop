apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-service
  namespace: meloop
  labels:
    app.kubernetes.io/name: music-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: music-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-service
    spec:
      containers:
        - name: music-service
          image: meloop-music-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: meloop-secrets
                  key: SPOTIFY_CLIENT_ID
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meloop-secrets
                  key: SPOTIFY_CLIENT_SECRET
            - name: SPOTIFY_MARKET
              valueFrom:
                configMapKeyRef:
                  name: meloop-config
                  key: SPOTIFY_MARKET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: music-service
  namespace: meloop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: music-service
  ports:
    - name: http
      port: 8091
      targetPort: http
