apiVersion: apps/v1
kind: Deployment
metadata:
  name: meloop-user
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meloop-user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meloop-user
    spec:
      containers:
        - name: user-service
          image: alancof/meloop-user:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: PORT
              value: "8082"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meloop-auth-connection
                  key: DATABASE_URL
            - name: AUTH_SERVICE_URL
              value: http://meloop-auth-service:8083
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: meloop-user
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-user
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meloop-user
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
