apiVersion: v1
kind: Service
metadata:
  name: meloop-redis-service
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meloop-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: meloop-redis
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: meloop-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meloop-redis
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-redis
spec:
  serviceName: meloop-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meloop-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meloop-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meloop-redis-credentials
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: cinder-ceph
        resources:
          requests:
            storage: 1Gi
