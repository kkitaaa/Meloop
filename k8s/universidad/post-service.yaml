apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: student-mcrisosto
  labels:
    app.kubernetes.io/name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: post-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: post-service
    spec:
      containers:
        - name: post-service
          image: ghcr.io/matiascs2005/meloop-post-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: GIN_MODE
              value: "release"
            - name: MINIO_ENDPOINT
              value: "minio.student-amanda-garcia-4679dc667f08.svc.cluster.local:9000"
            - name: MINIO_PUBLIC_ENDPOINT
              value: "http://minio.student-amanda-garcia-4679dc667f08.svc.cluster.local:9000"
            - name: MINIO_MEDIA_BUCKET
              value: "meloop-media"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: post-service-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: post-service-secrets
                  key: RABBITMQ_URL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: post-service-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: post-service-secrets
                  key: MINIO_SECRET_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
  namespace: student-mcrisosto
  labels:
    app.kubernetes.io/name: post-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: post-service
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP