apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meloop-ingress
  namespace: student-acofre
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
spec:
  ingressClassName: nginx
  rules:
    - host: meloop-acofre.dev.censei.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meloop-api-gateway-service
                port:
                  number: 8080