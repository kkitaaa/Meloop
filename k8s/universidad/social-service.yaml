apiVersion: apps/v1
kind: Deployment
metadata:
  name: meloop-social
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meloop-social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meloop-social
    spec:
      containers:
        - name: social-service
          image: alancof/meloop-social:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meloop-auth-connection
                  key: DATABASE_URL
            - name: AUTH_SERVICE_URL
              value: http://meloop-auth-service:8083
            - name: SOCIAL_SERVICE_PORT
              value: "8086"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: meloop-rabbitmq-credentials
                  key: RABBITMQ_URL
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: meloop-social
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meloop-social
  ports:
    - name: http
      port: 8086
      targetPort: http
      protocol: TCP
