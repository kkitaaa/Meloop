apiVersion: batch/v1
kind: Job
metadata:
  name: meloop-auth-migrations
  namespace: student-acofre
  labels:
    app.kubernetes.io/name: meloop-auth-migrations
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meloop-auth-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              for migration in /migrations/*.sql; do
                echo "Applying ${migration##*/}"
                psql --set ON_ERROR_STOP=1 \
                  --host=meloop-postgres-service \
                  --port=5432 \
                  --username="$POSTGRES_USER" \
                  --dbname="$POSTGRES_DB" \
                  --file="$migration"
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: meloop-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: meloop-postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: meloop-postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            name: meloop-auth-migrations
