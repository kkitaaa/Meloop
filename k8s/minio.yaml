apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: student-amanda-garcia-4679dc667f08
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: student-amanda-garcia-4679dc667f08
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: student-amanda-garcia-4679dc667f08
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          imagePullPolicy: Always
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          envFrom:
            - secretRef:
                name: minio-secrets
          volumeMounts:
            - name: minio-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init-files
  namespace: student-amanda-garcia-4679dc667f08
data:
  init-minio.sh: |
    #!/bin/sh
    set -e

    echo "Esperando disponibilidad de MinIO..."

    until /usr/bin/mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
      echo "MinIO aún no responde. Reintentando..."
      sleep 2
    done

    BUCKET_NAME="${MINIO_MEDIA_BUCKET:-meloop-media}"

    echo "Creando bucket privado..."
    /usr/bin/mc mb "local/${BUCKET_NAME}" --ignore-existing
    /usr/bin/mc anonymous set none "local/${BUCKET_NAME}"

    echo "Creando usuario de Media Service..."
    /usr/bin/mc admin user add local "${MINIO_MEDIA_USER}" "${MINIO_MEDIA_PASSWORD}" || true

    echo "Creando política de Media Service..."
    /usr/bin/mc admin policy create local media-service-policy /infrastructure/minio/media-service-policy.json || \
    /usr/bin/mc admin policy update local media-service-policy /infrastructure/minio/media-service-policy.json || \
    /usr/bin/mc admin policy add local media-service-policy /infrastructure/minio/media-service-policy.json || true

    echo "Asignando política..."
    /usr/bin/mc admin policy attach local media-service-policy --user "${MINIO_MEDIA_USER}" || \
    /usr/bin/mc admin policy set local media-service-policy user="${MINIO_MEDIA_USER}" || true

    echo "Inicialización de MinIO completada."

  media-service-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "MediaServiceBucketPermissions",
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": [
            "arn:aws:s3:::meloop-media"
          ]
        },
        {
          "Sid": "MediaServiceObjectPermissions",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::meloop-media/*"
          ]
        }
      ]
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: student-amanda-garcia-4679dc667f08
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          imagePullPolicy: Always
          command:
            - /bin/sh
            - /infrastructure/minio/init-minio.sh
          envFrom:
            - secretRef:
                name: minio-secrets
          env:
            - name: MINIO_MEDIA_BUCKET
              value: "meloop-media"
          volumeMounts:
            - name: init-files
              mountPath: /infrastructure/minio
      volumes:
        - name: init-files
          configMap:
            name: minio-init-files