apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: meloop
spec:
  ingressClassName: nginx
  rules:
    - host: meloop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
