apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: meloop
  labels:
    app.kubernetes.io/name: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: meloop-recommendation-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: meloop-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meloop-secrets
                  key: DATABASE_URL
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
