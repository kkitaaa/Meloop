name: Go Services CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - common
          - gamification-service
          - media-service
          - moderation-service
          - music-service
          - notification-service
          - post-service
          - recommendation-service
          - social-service
          - test-service
          - user-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
