name: OpenAPI Validation

on:
  push:
    branches:
      - '**'
    paths:
      - 'services/api-gateway/openapi.yaml'
      - 'Makefile'
      - '.github/workflows/api-openapi.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/api-gateway/openapi.yaml'
      - 'Makefile'
      - '.github/workflows/api-openapi.yml'

jobs:
  lint-openapi:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenAPI
        run: make lint-api
