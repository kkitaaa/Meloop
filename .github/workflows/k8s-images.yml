name: Kubernetes images

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'services/recommendation-service/**'
      - 'services/common/**'
      - 'ml-service/**'
      - '.dockerignore'
      - '.github/workflows/k8s-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'services/recommendation-service/**'
      - 'services/common/**'
      - 'ml-service/**'
      - '.dockerignore'
      - '.github/workflows/k8s-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: .
            file: services/api-gateway/Dockerfile
          - name: recommendation-service
            context: .
            file: services/recommendation-service/Dockerfile
          - name: ml-service
            context: ml-service
            file: ml-service/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
