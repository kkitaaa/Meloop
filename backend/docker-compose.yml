services:
  redis:
    image: redis:7.2
    container_name: redis_server
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "{*{Kt_|5vIUk>>{;3wAe"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  redis_data:
  rabbitmq_data: